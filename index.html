<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <!-- left farm background -->
      <div class="side-banner left"></div>

      <!-- Main content -->
      <div class="wrapper">
        <!-- Logo -->
        <div class="logo">
          <img src="images/cow.png" alt="Cow Logo" />
        </div>

        <!-- tabs -->
        <div class="nav-links">
          <a href="index.html" class="active">home</a>
          <a href="work.html">projects</a>
          <a href="links.html">contact</a>
        </div>

        <!-- page content -->
        <div class="content">
          <div class="intro">
            <div class="intro-text">
              <h1>hi!</h1>
              <p>
                i'm wenli, a 3rd year mechanical engineering w/ a cs minor
                student at northeastern university.
              </p>
            </div>

            <img
              src="images/me.gif"
              alt="intro gif of me waving"
              class="intro-gif"
              width="414"
              height="414"
            />
          </div>

          <div class="about">
            <p>some things about me 😊!</p>

            <div class="about-grid">
              <div class="about-item">
                <img
                  src="images/milk.gif"
                  alt="clinking glasses of milk"
                  loading="lazy"
                />
                <span>i like milk 🥛❤️</span>
              </div>
              <div class="about-item">
                <img src="images/climbing.gif" alt="climbing" loading="lazy" />
                <span>climbing 🧗</span>
              </div>
              <div class="about-item">
                <img
                  src="images/video-games.gif"
                  alt="late night bed gaming session"
                  loading="lazy"
                />
                <span>video games 🎮</span>
              </div>
              <div class="about-item">
                <img
                  src="images/munch.gif"
                  alt="eating with friends"
                  loading="lazy"
                />
                <span>eating with friends 🍗</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- right farm background -->
      <div class="side-banner right"></div>
    </div>
  </body>
</html>
